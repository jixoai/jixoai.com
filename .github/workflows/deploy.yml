name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Fetch GitHub projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run fetch:projects

      - name: Fetch project docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run fetch:docs

      - name: Download i18n cache from latest release
        continue-on-error: true
        run: |
          gh release download --pattern "i18n.zip" --clobber || echo "No i18n.zip found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Translate content
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm run translate

      - name: Build site
        run: pnpm run build:fast

      - name: Upload i18n cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cache
          path: i18n.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download i18n cache artifact
        uses: actions/download-artifact@v4
        with:
          name: i18n-cache

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing i18n release if it exists
          gh release delete i18n-cache --yes || true

          # Create new release with i18n.zip
          gh release create i18n-cache \
            --title "Translation Cache" \
            --notes "Automated translation cache from latest build" \
            i18n.zip
